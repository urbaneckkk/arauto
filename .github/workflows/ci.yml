name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissão mínima: o CI só lê o código. Nenhum segredo é usado aqui.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Postgres só para os testes do repositório (sem senha, só dentro do runner, apagado ao final).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: arauto
          POSTGRES_DB: arauto_teste
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arauto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TESTE: postgres://arauto@localhost:5432/arauto_teste

    steps:
      # As ações abaixo estão fixadas pelo hash do commit (o comentário diz a versão).
      # Tag pode ser movida por quem controla o repositório da ação; hash não.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A versão do pnpm vem do campo "packageManager" do package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm segredos
      - run: pnpm test:scripts
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
